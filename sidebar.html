<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrismArc</title>
    <style>
        .varela-round-regular {
            font-family: "Varela Round", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Varela Round", sans-serif;
            font-style: normal;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sidebar-tour.css">
    <link rel="stylesheet" href="calendar-preview.css">
    <link rel="stylesheet" href="sidebar-clean.css">
</head>

<body>
    <div id="sidebar-container" class="sidebar-container">
        <p id="spaceStoreStatus" class="space-store-status" role="alert" hidden></p>
        <section id="tabPreviewHint" class="tab-preview-hint" aria-label="Tab switcher previews" hidden>
            <p id="tabPreviewHintMessage" role="status">Show page previews for Option+Tab as you browse. Chrome will ask for access to all sites.</p>
            <button id="tabPreviewHintEnable" class="tab-preview-hint-enable sidebar-text-action sidebar-text-action-primary" type="button" aria-describedby="tabPreviewHintMessage">Enable previews</button>
            <button id="tabPreviewHintDismiss" class="tab-preview-hint-dismiss" type="button" aria-label="Dismiss preview hint" title="Dismiss preview hint">×</button>
        </section>
        <div class="pinned-favicons empty" id="pinnedFavicons" aria-label="Favorites">
            <!-- Persistent pinned tabs will be displayed here -->
            <div class="pinned-placeholder-container">
                <div class="pinned-tab-placeholder">
                    <button class="placeholder-close-btn">&times;</button>
                    <div class="placeholder-title" vb>Drag to add Favorites</div>
                    <div class="placeholder-subtitle">Favorites keep your most used sites close across all spaces</div>
                </div>
            </div>
        </div>
        <div class="spaces-list" id="spacesList">
            <!-- Spaces will be dynamically added here -->
        </div>
        <div class="space-switcher-container">
            <div class="url-copy-toast" id="urlCopyToast">Copied current URL</div>
            <div class="space-switcher" id="spaceSwitcher">
                <!-- Space switcher buttons will be added here -->
            </div>
            <button id="quickSwitcherBtn" class="footer-icon-button quick-switcher-btn" type="button" aria-labelledby="quickSwitcherTooltip">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
                <span id="quickSwitcherTooltip" class="quick-switcher-tooltip">Quick Switcher</span>
            </button>
            <button class="footer-icon-button add-space-toggle" id="addSpaceBtn" title="Create a new space">
                <span>+</span>
            </button>
            <div class="add-space-input-container" id="addSpaceInputContainer">
                <div class="color-picker-grid create-space-picker" id="createSpaceColorSwatch" role="group" aria-label="New space color"></div>
                <div class="create-space-container">
                    <input type="text" id="newSpaceName" placeholder="Enter space name">
                    <select id="spaceColor" class="space-color-select">
                        <option value="prismarc">Default</option>
                        <option value="grey">Grey</option>
                        <option value="blue">Blue</option>
                        <option value="red">Red</option>
                        <option value="yellow">Yellow</option>
                        <option value="green">Green</option>
                        <option value="pink">Pink</option>
                        <option value="purple">Purple</option>
                        <option value="cyan">Cyan</option>
                    </select>
                    <button id="createSpaceBtn" disabled>Create</button>
                </div>
            </div>
        </div>
    </div>
    <template id="spaceTemplate">
        <div class="space">
            <div class="space-header">
                <div class="space-name-container">
                    <button type="button" class="space-toggle-chevron" title="Toggle pinned bookmarks" aria-expanded="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="chevron-icon" aria-hidden="true">
                            <path d="M7 10l5 5 5-5z" />
                        </svg>
                        <span class="space-title"></span>
                    </button>
                    <input type="text" class="space-name" aria-label="Space name" hidden>
                </div>
                <button id="archive-button" class="sidebar-button" title="Archived Tabs">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" class="svg-icon">
                        <path
                            d="M475 256c0-30-5-58-17-85-12-27-27-51-47-70-19-20-43-35-70-47-27-12-55-17-85-17-33 0-64 6-93 20-30 14-55 34-76 59-1 2-2 4-2 6 0 3 1 4 3 6l39 39c2 2 4 3 7 3 3 0 5-2 7-3 13-19 31-33 51-42 20-10 41-15 64-15 20 0 39 4 57 11 18 8 33 18 46 32 14 13 24 28 32 46 7 18 11 37 11 57 0 20-4 39-11 57-8 18-18 33-32 46-13 14-28 24-46 32-18 7-37 11-57 11-19 0-37-3-54-10-17-7-32-16-45-29l39-39c6-6 7-13 4-20-4-8-9-11-17-11l-128 0c-5 0-9 1-13 5-4 4-5 8-5 13l0 128c0 8 3 13 11 17 7 3 14 2 20-4l37-37c20 19 44 34 70 45 26 10 53 15 81 15 30 0 58-5 85-17 27-12 51-27 70-47 20-19 35-43 47-70 12-27 17-55 17-85z m-182 82l0-128c0-2-1-5-3-6-2-2-4-3-7-3l-91 0c-3 0-5 1-7 3-1 1-2 4-2 6l0 19c0 2 1 4 2 6 2 2 4 3 7 3l64 0 0 100c0 3 1 5 3 7 1 2 3 2 6 2l18 0c3 0 5 0 7-2 2-2 3-4 3-7z" />
                    </svg>
                </button>
                <div class="space-options-container">
                    <button id="space-options" class="space-options" type="button" title="Space options" aria-expanded="false">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/>
                        </svg>
                    </button>
                    <div class="space-options-dropdown space-menu-popover" role="group" aria-label="Space options" hidden>
                        <select class="space-color-select" id="spaceColorSelect">
                            <option value="prismarc">Default</option>
                            <option value="grey">Grey</option>
                            <option value="blue">Blue</option>
                            <option value="red">Red</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                            <option value="pink">Pink</option>
                            <option value="purple">Purple</option>
                            <option value="cyan">Cyan</option>
                        </select>
                        <div class="color-picker-grid" id="spaceOptionColorSwatch" role="group" aria-label="Space color"></div>
                        <div class="space-menu-actions">
                            <button type="button" class="rename-space-btn">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6 4 4M5 19l1-4L16.5 4.5a2.8 2.8 0 0 1 4 4L10 19l-5 1z"/></svg>
                                Rename Space
                            </button>
                            <button type="button" class="new-folder-btn">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M3 17a2 2 0 0 0 2 2h7m5-2h6m-3-3v6"/></svg>
                                New Folder
                            </button>
                            <button type="button" class="settings-btn">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.5 2.4a7 7 0 0 0-1.8 1L5.4 5.7l-2 3.5 1.8 1.7a7 7 0 0 0 0 2.2l-1.8 1.7 2 3.5 2.3-.7a7 7 0 0 0 1.8 1L10 21h4l.5-2.4a7 7 0 0 0 1.8-1l2.3.7 2-3.5-1.8-1.7a7 7 0 0 0 0-2.2l1.8-1.7-2-3.5-2.3.7a7 7 0 0 0-1.8-1L14 3Z"/><circle cx="12" cy="12" r="2.6"/></svg>
                                Settings
                            </button>
                            <button type="button" class="delete-space-btn">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3m3 0-1 14H7L6 6m4 4v6m4-6v6"/></svg>
                                Delete Space
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="archive-section">
                <div id="archived-tabs-popup" class="archived-tabs-popup">
                    <h3>Archived</h3>
                    <div class="archived-tabs-list"></div>
                    <div class="no-archived-tabs-message">No archived tabs.</div>
                </div>
            </div>
            <div id="space-content" class="space-content">
                <div class="pinned-tabs">
                    <!-- <h3>Pinned</h3> -->
                    <div class="placeholder-container">
                        <div class="tab-placeholder">Drag a tab here to pin</div>
                    </div>
                    <div class="tabs-container" data-tab-type="pinned">
                        <template id="folderTemplate">
                            <div class="folder collapsed">
                                <div class="folder-header" draggable="true">
                                    <div class="folder-icon"><svg xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 512 512">
                                            <path
                                                d="M0 96C0 60.7 28.7 32 64 32l132.1 0c19.1 0 37.4 7.6 50.9 21.1L289.9 96 448 96c35.3 0 64 28.7 64 64l0 256c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96zM64 80c-8.8 0-16 7.2-16 16l0 320c0 8.8 7.2 16 16 16l384 0c8.8 0 16-7.2 16-16l0-256c0-8.8-7.2-16-16-16l-161.4 0c-10.6 0-20.8-4.2-28.3-11.7L213.1 87c-4.5-4.5-10.6-7-17-7L64 80z">
                                            </path>
                                        </svg></div>
                                    <input type="text" class="folder-name" placeholder="Untitled">
                                    <span class="folder-title hidden">Untitled</span>
                                    <button class="folder-toggle collapsed" title="Toggle folder"></button>
                                </div>
                                <div class="folder-collapsed-tabs"></div>
                                <div class="folder-content collapsed">
                                    <div class="tab-placeholder">Drag a tab here to add</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="temporary-tabs">
                    <div class="temp-header">
                        <span class="clean-section-label">Temporary tabs</span>
                        <div class="divider-line" aria-hidden="true"></div>
                        <button class="clean-tabs-btn" type="button" aria-expanded="false">
                            Clean
                            <svg class="clean-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                                <path d="m2.5 4.25 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <section class="clean-panel" aria-label="Clean old tabs" tabindex="-1" hidden>
                        <div class="clean-slider-heading">
                            <label>Clean old tabs</label>
                            <span class="clean-cutoff" aria-hidden="true">None selected</span>
                        </div>
                        <input class="clean-range" type="range" min="0" max="0" step="1" value="0" disabled>
                        <span class="clean-range-description clean-sr-only">Marks temporary tabs in this space, starting with the least recently viewed.</span>
                        <div class="clean-axis" aria-hidden="true"><span>None</span><span>All</span></div>
                        <div class="clean-actions">
                            <button class="clean-cancel" type="button">Cancel</button>
                            <button class="clean-apply" type="button" disabled>Close 0 tabs</button>
                        </div>
                        <div class="clean-archive-controls"></div>
                    </section>
                    <div class="tabs-container" data-tab-type="temporary"></div>
                    <p class="clean-outcome" role="status"></p>
                </div>
            </div>
        </div>
    </template>
    <template id="tabTemplate">
        <div class="tab">
            <span class="sidebar-favicon"><img class="tab-favicon" alt="Favicon"></span>
            <div class="tab-details">
                <span class="tab-title-display"></span>
                <span class="tab-domain-display" style="display: none;"></span>
                <input type="text" class="tab-title-input" style="display: none;" spellcheck="false">
            </div>
            <button class="tab-close" title="Close Tab">×</button>
        </div>
    </template>
    <script type="module" src="sidebar.js"></script>
</body>

</html>
