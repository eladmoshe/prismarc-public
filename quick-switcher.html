<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>PrismArc · Quick Switcher</title>
  <link rel="stylesheet" href="quick-switcher.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-tab" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16l-6-4z"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7m2-4v5l3 2"/></symbol>
    <symbol id="icon-return" viewBox="0 0 24 24"><path d="M20 4v9a3 3 0 0 1-3 3H4m5-5-5 5 5 5"/></symbol>
  </svg>
  <main class="palette" aria-label="Quick Switcher">
    <div class="search-line">
      <svg class="search-icon icon" aria-hidden="true"><use href="#icon-search"/></svg>
      <input id="search" type="text" placeholder="Search tabs, bookmarks, history…" aria-label="Search tabs, bookmarks, and history" role="combobox" aria-haspopup="grid" aria-autocomplete="list" aria-expanded="true" aria-controls="results" aria-describedby="search-status" autocomplete="off" spellcheck="false" maxlength="1000">
      <button id="close" class="escape" type="button" aria-label="Close Quick Switcher">esc</button>
    </div>
    <div class="results-heading"><span id="results-label">Jump back in</span><span id="results-count"></span></div>
    <div class="results-area">
      <div id="results" role="grid" aria-label="Search results"></div>
      <div id="empty" class="empty" hidden>
        <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
        <span>No matches found</span>
        <small>Try a page title or website address.</small>
      </div>
    </div>
    <footer class="footer">
      <div class="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> <span id="action-label">switch to tab</span></span>
        <span><kbd>1–9</kbd> open result</span>
        <span id="digit-entry-hint">
          <kbd id="digit-entry-keycap" aria-hidden="true">Alt+0–9</kbd>
          <span id="digit-entry-description" class="sr-only">Alt plus 0 through 9</span> type digit
        </span>
      </div>
      <div id="search-status" class="search-status" role="status" aria-live="polite">Searching your browser…</div>
    </footer>
    <span id="announcement" class="sr-only" aria-live="polite"></span>
  </main>
  <script type="module" src="quick-switcher.js"></script>
</body>
</html>
